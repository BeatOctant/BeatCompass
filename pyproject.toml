[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "octantcompass"
version = "0.2.1"
requires-python = ">=3.11.4"  # OctantVector's (tarfile extraction filters)
dependencies = ["fastapi>=0.115,<1", "platformdirs>=4.2,<5", "pydantic>=2.9,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
build = ["pyinstaller>=6.9,<7"]
octantvector = ["octantvector>=0.9.0,<0.10"]
# The OctantCompass window (`gui`). On Linux pywebview draws with GTK and WebKitGTK 4.1 through PyGObject, which builds
# against the system's gobject-introspection and cairo (README); `serve` needs none of it.
gui = ["pywebview[gtk]>=6.2,<7; sys_platform == 'linux'", "pywebview>=6.2,<7; sys_platform != 'linux'"]

[tool.uv.sources]
octantvector = { git = "https://github.com/BeatOctant/OctantVector.git", tag = "v0.9.2" }

[project.scripts]
octantcompass = "octantcompass.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
